---
layout: compress
---

{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js" data-theme="light">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <script>
      /* Apply a saved/system preference before the page is painted. */
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) { /* storage disabled */ }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme',
          saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light'));
      })();
    </script>
    <script defer src="{{ '/assets/js/dark-mode.js' | relative_url }}"></script>
  </head>

  <body>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}
  </body>
</html>
